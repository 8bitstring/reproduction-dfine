__include__:
  - '../D-FINE/configs/dfine/dfine_hgnetv2_s_coco.yml'

output_dir: './runs/dfine_s_coco_val2017'

HGNetv2:
  pretrained: False

train_dataloader:
  num_workers: 0
  dataset:
