val_dataloader:
  num_workers: 0
  total_batch_size: 8
  dataset:
    img_folder: '../paper_reproduction/datasets/coco/images/val2017'
    ann_file: '../paper_reproduction/datasets/coco/annotations/instances_val2017.json'
